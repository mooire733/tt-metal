name: "LLK perf gate"

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  actions: read
  contents: read
  checks: write
  packages: write
  pull-requests: write

jobs:
  measure:
    name: "Measure the PR on ${{ matrix.arch }} (non speed-of-light)"
    if: >-
      github.event_name == 'pull_request' &&
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
          (github.event.action == 'synchronize'
           && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
        )
      )
    strategy:
      fail-fast: false
      matrix:
        arch: [blackhole, wormhole]
    uses: ./.github/workflows/llk-perf-impl.yaml
    with:
      architecture: ${{ matrix.arch }}
      speed-of-light: false
      perf-run-types: L1_TO_L1
      upload-to-warehouse: false
      pipeline: pr
    secrets: inherit

  llk-perf-gate:
    name: "LLK perf regression gate (${{ matrix.arch }})"
    needs: measure
    if: >-
      always() &&
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'llk-perf-gate') ||
          (github.event.action == 'synchronize'
           && contains(github.event.pull_request.labels.*.name, 'llk-perf-gate'))
        )
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: blackhole
            threshold: "0.02"
          - arch: wormhole
            threshold: "0.08"
    uses: ./.github/workflows/llk-perf-gate-impl.yaml
    with:
      arch: ${{ matrix.arch }}
      run_types: L1_TO_L1
      threshold: ${{ matrix.threshold }}
      min_cycles: "30"
      fail_on_regression: false
    secrets: inherit
